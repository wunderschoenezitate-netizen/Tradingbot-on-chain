[package]
name = "sol-grid-bot"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Asynchroner Low-Latency Grid-Trading-Bot für SOL/USDC mit Paper-Trading und Discord-Alerts"
publish = false

[dependencies]
# Fehlerbehandlung
anyhow = "1"

# Async-Runtime (Multi-Thread-Scheduler)
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }

# Websocket-Price-Feed (rustls → keine OpenSSL-Abhängigkeit auf dem VPS)
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# HTTP-Client für Discord-Webhooks / REST
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2"] }

# (De-)Serialisierung
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Konfiguration aus .env
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Zeitstempel für Discord-Embeds
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
